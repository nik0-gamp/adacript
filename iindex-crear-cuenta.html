<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Page Title</title>
    <link rel='stylesheet' href='css/style-inicio-sesion-crear-cuenta.css'>
</head>
<body>
     <div class="logo">
        <img src="img/logoAdacript.png" alt="Logo">
        <img src="img/letras logo 1.png" alt="Letras">
    </div>

     <div class="contenedor oculto" id="form-registro">
        <h1>Crear cuenta </h1>
        <p>Crea una cuenta con AdaCript!!</p>
        <label for="nombre">Nombre empresa:</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="correo">Nombre usuario:</label>
        <input type="email" id="correo" name="correo" required>
        <label for="telefono">Contraseña:</label>
        <input type="tel" id="telefono" name="telefono" class="contraseña">
        <button id="btn-atras">Atrás</button>
        <button>Crear Cuenta</button>
    </div>

</body>
</html>
