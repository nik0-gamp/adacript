<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>AdaCript - Crear Cuenta</title>
    <link rel='stylesheet' href='css/style-inicio-sesion-crear-cuenta.css'>
</head>
<body>

    <!-- Envoltura principal para activar la alineación Flexbox con el CSS -->
    <div class="pantalla-login">

        <div class="logo">
            <img src="img/logoAdacript.png" alt="Logo" class="img-logo">
            <img src="img/letras logo 1.png" alt="Letras" class="img-letras">
        </div>

        <!-- Se quitó la clase 'oculto' para que sea visible en este archivo -->
        <div class="contenedor" id="form-registro">
            <h1>Crear cuenta</h1>
            <p class="subtitulo">Crea una cuenta con AdaCript!!</p>
            
            <div class="campo">
                <label for="nombre">Nombre empresa:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="campo">
                <label for="correo">Nombre usuario:</label>
                <!-- Corregido a type="text" ya que el label pide nombre de usuario -->
                <input type="text" id="correo" name="correo" required>
            </div>
            
            <div class="campo contraseña">
                <label for="telefono">Contraseña:</label>
                <!-- Corregido a type="password" para ocultar los caracteres al escribir -->
                <input type="password" id="telefono" name="telefono" required>
            </div>
            
            <!-- Grupo de botones alineados con la estructura del CSS -->
            <div class="grupo-botones">
                <button id="btn-atras" class="btn-volver-atras">Atrás</button>
                <button class="btn-crear">Crear Cuenta</button>
            </div>
        </div>

    </div>

</body>
</html>
