<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - AdaCript</title>
    <link rel="stylesheet" href="css/style-recuperar-contraseña.css">
</head>

<body>

    <main class="recuperacion">

        <!-- formularioo, -->
        <section class="formulario">

            <div class="contenedor">

                <h1>recuperar contraseña</h1>

                <p class="descripcion">
                    ingresa tu correo o usuario y te enviaremos instrucciones para recuperar el acceso.
                </p>

                <div class="campo">

                    <label for="correo">
                        correo electrónico o usuario
                    </label>

                    <div class="input-contenedor">

                        <span class="icono">♙</span>

                        <input
                            type="text"
                            id="correo"
                            name="correo"
                            placeholder="nombre@correo.com"
                            required
                        >

                    </div>

                </div>

                <button class="btn-enviar" type="submit">
                    enviar instrucciones →
                </button>

                <button class="btn-volver" type="button">
                    ← &nbsp; volver a iniciar sesión
                </button>

            </div>

        </section>


        <!-- logoo -->
        <section class="logo-seccion">

            <img
                src="img/logoAdacript.png"
                alt="Logo AdaCript"
                class="logo-imagen"
            >

            <img
                src="img/letras logo 1.png"
                alt="AdaCript"
                class="logo-letras"
            >

        </section>

    </main>

</body>

</html>
