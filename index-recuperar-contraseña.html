<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recuperar contraseña - AdaCript</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    background: linear-gradient(
        to bottom,
        #05060B,
        #111827,
        #252A45
    );

    font-family: Arial, sans-serif;

    color: #ffffff;
}


/* cont principl*/

.recuperacion {

    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 140px;
}


/* form*/

.formulario {

    width: 450px;
}

.contenedor {

    width: 100%;
    background: #101827;
    border: 1px solid #24324a;
    border-radius: 8px;
    padding: 35px 30px;
    box-shadow:
        0 15px 30px rgba(0, 0, 0, 0.20);
}


/* titlee*/

.contenedor h1 {

    font-family: Georgia, 'Times New Roman', serif;
    font-size: 26px;
    font-weight: bold;
    color: #f2f2f2;
    margin-bottom: 8px;
}


/*desc */

.descripcion {

    color: #8993a7;
    font-size: 11px;
    line-height: 15px;
    margin-bottom: 20px;
}


/* campos */

.campo {

    display: flex;
    flex-direction: column;
    gap: 7px;
    margin-bottom: 16px;
}


.campo label {

    color: #d0d4dc;
    font-size: 9px;
    font-weight: normal;
}


/* inp*/

.input-contenedor {

    position: relative;
    width: 100%;
    
}


.input-contenedor input {

    width: 100%;
    height: 40px;
    padding: 0 30px;
    border-radius: 6px;
    border: 1px solid #2b3a55;
    background: #111b2e;
    color: #ffffff;
    outline: none;
    font-size: 10px;
}


.input-contenedor input::placeholder {

    color: #7b8598;
}


.input-contenedor input:focus {

    border-color: #596b88;
    box-shadow: 0 0 5px rgba(100, 120, 150, 0.2);
}



.icono {
    
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    color: #77849a;
    font-size: 12px;
}



.btn-enviar {

    width: 100%;
    height: 40px;
    border: none;
    border-radius: 5px;
    background: #2a3b5b;
    color: #e0e3e8;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 10px;
    cursor: pointer;
    margin-bottom: 15px;
    transition: 0.2s;
}


.btn-enviar:hover {

    background: #344a70;
}



.btn-volver {

    width: 100%;
    height: 36px;
    border-radius: 5px;
    border: 1px solid #263650;
    background: transparent;
    color: #8993a7;
    font-size: 9px;
    cursor: pointer;
    transition: 0.2s;
}


.btn-volver:hover {

    background: #162238;
    color: #ffffff;
}


.logo-seccion {

    width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transform: translateX(90px);
}


.logo-imagen {

    width: 500px;
    height: auto;
    margin-bottom: 20px;
}


.logo-letras {
    
    width: 300px;
    height: auto;
}
    </style>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="recuperacion">

        <!-- formularioo, -->
        <section class="formulario">

            <div class="contenedor">

                <h1>recuperar contraseña</h1>

                <p class="descripcion">
                    ingresa tu correo o usuario y te enviaremos instrucciones para recuperar el acceso.
                </p>

                <div class="campo">

                    <label for="correo">
                        correo electrónico o usuario
                    </label>

                    <div class="input-contenedor">

                        <span class="icono">♙</span>

                        <input
                            type="text"
                            id="correo"
                            name="correo"
                            placeholder="nombre@correo.com"
                            required
                        >

                    </div>

                </div>

                <button class="btn-enviar" type="submit">
                    enviar instrucciones →
                </button>

                <button class="btn-volver" type="button">
                    ← &nbsp; volver a iniciar sesión
                </button>

            </div>

        </section>


        <!-- logoo -->
        <section class="logo-seccion">

            <img
                src="logoAdacript.png"
                alt="Logo AdaCript"
                class="logo-imagen"
            >

            <img
                src="letras logo 1.png"
                alt="AdaCript"
                class="logo-letras"
            >

        </section>

    </main>

</body>

</html>
