<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>AdaCript</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body{
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #05060B, #111827, #252A45);
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    
}

.logo {
    height: auto;
    width: 500px;
    display: flex;
    flex-direction: column;
}

.contenedor{
    border: 1px solid rgba(255, 255, 255, 0.308);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    height: auto;
    width: 700px;
    border-radius: 12px;
    background: linear-gradient(to top, #05060B, #111827, #252A45);
    padding: 60px;
    margin-left: 300px;
    color: aliceblue;
}

h1 {
    font-size: 4em; 
    }
    p {
    font-size: 1em; 
    line-height: 2.8; 
    }
    button {
    font-size: 1.5em; 
    padding: 0.7em 9em; 
    border-radius: 12px;
    background-color: transparent;
    border: 1px solid rgba(255, 255, 255, 0.616);
    color: aliceblue;
    justify-content: center;
    margin: 0 auto 22px auto;
    }
    .contraseña{
        margin-bottom: 40px;
    }
    button:hover{
        background-color: rgba(240, 255, 255, 0.39);
    }
    input{
        font-size: 3em;
        border-radius: 5px;
        background-color: transparent;
        border: 1px solid rgba(255, 255, 255, 0.308);
    }

.oculto {
  display: none !important;
}
    </style>
</head>
<body>
    <div class="logo">
        <img src="img/logoAdacript.png" alt="Logo">
        <img src="img/letras logo 1.png" alt="Letras">
    </div>

    <div class="contenedor" id="form-login">
        <h1>Inicio de sesion</h1>
        <p>vas a iniciar sesion en adacript</p>
        <p><strong>Nombre de usuario</strong></p>
        <input type="nombre de usuario">
        <p> <strong>contraseña</strong></p>
        <input type="contraseña" class="contraseña">
        <button class="inicio">iniciar sesion</button>
        <button id="btn-ir-a-registro">crear cuenta</button>
    </div>

    <div class="contenedor oculto" id="form-registro">
        <h1>Crear cuenta </h1>
        <p>Crea una cuenta con AdaCript!!</p>
        <label for="nombre">Nombre empresa:</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="correo">Nombre usuario:</label>
        <input type="email" id="correo" name="correo" required>
        <label for="telefono">Contraseña:</label>
        <input type="tel" id="telefono" name="telefono">
        <button id="btn-atras">Atrás</button>
        <button>Crear Cuenta</button>
    </div>

    <div class="contenedor oculto" id="form-recuperar">
        <h2>Recuperar contraseña</h2>
        <p>Ingresa tu correo y te enviaremos instrucciones para recuperar el acceso.</p>
        <input type="email" id="correo" name="correo" required>
        <label for="codigo">Ingrese el codigo</label>
        <input type="text">
        <button>Enviar instrucciones</button>
         <button id="btn-volver-a-login">Volver a inicio de sesion</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
