<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>AdaCript</title>
    <style>
*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body{
    margin: 0;
    padding: 0;
    height: 100vh;
    background: linear-gradient(to bottom, #05060B, #111827, #252A45);
    background-size: cover;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    
}

.logo {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.contenedor{
    border-radius: 12px;
    border: 2px solid rgb(156, 157, 218);
    padding: 30px;
    color: aliceblue;
}
    </style>
</head>
<body>
    <div class="logo">
        <img src="img/logoAdacript.png" alt="Logo">
        <img src="img/letras logo 1.png" alt="Letras">
    </div>

    <div class="contenedor">
        <h1>Inicio de sesion</h1>
        <p>vas a iniciar sesion en adacript</p>
        <p><strong>Nombre de usuario</strong></p>
        <input type="nombre de usuario">
        <p> <strong>contraseña</strong></p>
        <input type="contraseña">
        <button>iniciar sesion</button>
        <button>crear cuenta</button>
        <button>Recuperar contraseña</button>
    </div>

    <div class="contenedor">
        <h1>Crear cuenta </h1>
        <p>Crea una cuenta con AdaCript!!</p>
        <label for="nombre">Nombre empresa:</label>
        <input type="text" id="nombre" name="nombre" required>
        <label for="correo">Nombre usuario:</label>
        <input type="email" id="correo" name="correo" required>
        <label for="telefono">Contraseña:</label>
        <input type="tel" id="telefono" name="telefono">
        <button>Atrás</button>
        <button>Crear Cuenta</button>
    </div>

    <div class="#">
        <h2>Recuperar contraseña</h2>
        <p>Ingresa tu correo y te enviaremos instrucciones para recuperar el acceso.</p>
        <input type="email" id="correo" name="correo" required>
        <label for="codigo">Ingrese el codigo</label>
        <input type="text">
        <button>Enviar instrucciones</button>
        <button>Volver a inicio de sesion</button>
    </div>
</body>
</html>
