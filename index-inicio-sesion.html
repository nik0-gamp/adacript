<!DOCTYPE html>
<html lang='es'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>AdaCript</title>
    <link rel='stylesheet' href='css/style-inicio-sesion-crear-cuenta.css'>
</head>
<body>

    <div class="pantalla-login">
        
        <div class="logo">
            <img src="img/logoAdacript.png" alt="Logo" class="img-logo">
            <img src="img/letras logo 1.png" alt="Letras" class="img-letras">
        </div>

        <div class="contenedor" id="form-login">
            <h1>Inicio de sesión</h1>
            <p class="subtitulo">Vas a iniciar sesión en AdaCript</p>
            
            <div class="campo">
                <label>Nombre de usuario</label>
                <input type="text">
            </div>
            
            <div class="campo contraseña">
                <div class="fila-label">
                    <label>Contraseña</label>
                    <a href="#" class="link-olvido">¿Olvidaste tu contraseña?</a>
                </div>
                <input type="password">
            </div>
            
            <button class="btn-inicio">Iniciar sesión</button>
            <button id="btn-ir-a-registro" class="btn-registro">Crear cuenta</button>
        </div>

    </div>

</body>
</html>
